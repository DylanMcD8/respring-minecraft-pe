[package]
name = "minecraft-probe-entry"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "minecraft_probe"
crate-type = ["staticlib"]

[dependencies]
touchHLE = { path = "../../compatibility-core", default-features = false, features = ["ios-static"] }

# The interpreter's hot loop spans the cpu, mem and gles crates' modules, so a
# single codegen unit with cross-crate LTO lets it inline guest memory access
# and dispatch into one function. Unwinding stays on for catch_unwind.
[profile.release]
codegen-units = 1
lto = "fat"
